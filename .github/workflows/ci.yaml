name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with optional extras)
        run: pip install -e ".[dev,explain]"
      - name: Run tests with coverage
        run: pytest --cov=cardiorisk --cov-report=term-missing

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cardiorisk .
      - name: Smoke test (CLI + tests in image)
        run: |
          docker run --rm cardiorisk cardiorisk version
          docker run --rm -v "$PWD:/app" cardiorisk pytest -q -p no:cacheprovider
