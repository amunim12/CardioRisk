# CardioRisk pipeline configuration.
# Loaded and validated by cardiorisk.config.Settings (pydantic).

seed: 42

data:
  uci_id: 45            # UCI Heart Disease dataset id
  raw_path: data/raw/heart_disease.csv
  test_size: 0.2

target:
  source_column: num    # UCI severity column (0-4)
  name: target          # binarized output column

# Decision threshold tuning. We optimize the operating point for sensitivity
# (recall) because a missed at-risk patient is the clinically costly error.
threshold:
  strategy: max_recall_at_min_precision
  min_precision: 0.70

cv:
  n_splits: 5
  scoring: roc_auc

models:
  - logistic_regression
  - decision_tree
  - hist_gradient_boosting

artifacts_dir: artifacts

tracking:
  enabled: true         # uses MLflow if installed; silently skipped otherwise
  experiment_name: cardiorisk
