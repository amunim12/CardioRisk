[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiorisk"
version = "0.1.0"
description = "Advanced, MLOps-grade heart disease risk prediction system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "amunim12" }]
keywords = ["machine-learning", "healthcare", "classification", "mlops"]

# Core runtime: the stable stack required to fetch data, train, evaluate,
# and serve the API. Deliberately excludes heavy/optional packages so the
# pipeline runs even where those lack wheels (e.g. on bleeding-edge Python).
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "ucimlrepo>=0.0.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Guarded at runtime via importlib — install if your Python has wheels.
tracking = ["mlflow>=2.14"]
explain = ["shap>=0.45"]
app = ["streamlit>=1.36"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
cardiorisk = "cardiorisk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF012"]  # mutable class attrs are fine for pydantic/sklearn configs

[tool.mypy]
python_version = "3.11"
packages = ["cardiorisk"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true  # third-party ML libs ship incomplete stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["cardiorisk"]
branch = true
